<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f1ede4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171513" media="(prefers-color-scheme: dark)">
<script>
  // Apply the saved (or system) theme before first paint.
  (function () {
    var theme;
    try { theme = localStorage.getItem("theme"); } catch (e) {}
    if (theme !== "day" && theme !== "night") {
      theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "night" : "day";
    }
    document.documentElement.setAttribute("data-theme", theme);
  })();
</script>
<link rel="preload" href="{{ '/assets/fonts/newsreader.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ '/assets/fonts/ibm-plex-mono-500.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
